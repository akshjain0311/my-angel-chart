<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NIFTY 50 Mobile Chart</title>
    
    <!-- TradingView Lightweight Charts Library -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <!-- Mobile Touch Drawing Tools Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts-drawing@0.2.0/dist/lightweight-charts-drawing.umd.production.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #131722; color: #fff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        #toolbar { display: flex; gap: 6px; padding: 8px; background: #1e222d; border-bottom: 1px solid #2a2e39; overflow-x: auto; }
        button { background: #2962ff; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
        button.secondary { background: #ff9800; }
        button.danger { background: #f44336; }
        #chart { flex: 1; width: 100vw; }

        /* Login Screen Modal */
        #login-overlay { position: fixed; inset: 0; background: #131722; display: flex; flex-direction: column; justify-content: center; padding: 24px; z-index: 1000; }
        .card { background: #1e222d; border: 1px solid #2a2e39; border-radius: 8px; padding: 20px; }
        h2 { color: #2962ff; font-size: 20px; margin-bottom: 16px; text-align: center; }
        input { width: 100%; background: #131722; border: 1px solid #2a2e39; color: #fff; padding: 12px; margin-bottom: 12px; border-radius: 4px; font-size: 14px; outline: none; }
        #status-msg { color: #ff9800; font-size: 12px; margin-bottom: 12px; text-align: center; }
        .btn-group { display: flex; flex-direction: column; gap: 10px; }
    </style>
</head>
<body>

    <!-- SMS OTP Login Screen -->
    <div id="login-overlay">
        <div class="card">
            <h2>NIFTY 50 Live Chart Login</h2>
            <div id="status-msg">Enter Credentials to Receive SMS OTP</div>
            
            <input type="text" id="apiKey" placeholder="Angel One API Key">
            <input type="text" id="clientCode" placeholder="Client ID (e.g. A123456)">
            <input type="password" id="mpin" placeholder="4-Digit Angel One MPIN">
            <input type="text" id="smsOtp" placeholder="Enter Received SMS OTP" disabled>
            
            <div class="btn-group">
                <button id="sendOtpBtn" onclick="requestSmsOtp()" class="secondary" style="padding: 12px; font-size:14px;">1. Send SMS OTP</button>
                <button id="loginBtn" onclick="verifyOtpAndLogin()" style="padding: 12px; font-size:14px;" disabled>2. Verify OTP & Open Chart</button>
            </div>
        </div>
    </div>

    <!-- Drawing Toolbar -->
    <div id="toolbar">
        <span style="font-size:12px; font-weight:bold; color:#00e676; align-self:center; margin-right:6px;">NIFTY 50</span>
        <button onclick="setTool('trend_line')">✏️ Trendline</button>
        <button onclick="setTool('horizontal_line')">➖ Horz Line</button>
        <button onclick="setTool('fib_retracement')">🌀 Fibonacci</button>
        <button onclick="addEMA(20)">📈 EMA 20</button>
        <button onclick="addSupertrend()">🚀 Supertrend</button>
        <button class="danger" onclick="clearDrawings()">🗑️ Clear</button>
    </div>

    <!-- Chart Canvas -->
    <div id="chart"></div>

    <script>
        let chart, candleSeries, drawingManager, ws;
        const DEFAULT_NIFTY_TOKEN = "99926000"; // NIFTY 50 Spot Token

        function initChart() {
            const container = document.getElementById('chart');
            chart = LightweightCharts.createChart(container, {
                layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { timeVisible: true, secondsVisible: false }
            });

            candleSeries = chart.addCandlestickSeries({
                upColor: '#26a69a', downColor: '#ef5350', borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
            });

            drawingManager = new LightweightChartsDrawing.DrawingManager();
            drawingManager.attach(chart, candleSeries, container);
        }

        function setTool(tool) { drawingManager.setTool(tool); }
        function clearDrawings() { drawingManager.clearDrawings(); }

        // Step 1: Send SMS OTP
        async function requestSmsOtp() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const clientCode = document.getElementById('clientCode').value.trim();
            const mpin = document.getElementById('mpin').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!apiKey || !clientCode || !mpin) {
                alert('Please enter API Key, Client ID, and MPIN');
                return;
            }

            statusMsg.innerText = "Requesting SMS OTP from Angel One...";

            try {
                const response = await fetch('https://apiconnect.angelone.in/rest/auth/angelone/user/v1/loginByPassword', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-UserType': 'USER',
                        'X-SourceID': 'WEB',
                        'X-ClientLocalIP': '127.0.0.1',
                        'X-ClientPublicIP': '127.0.0.1',
                        'X-MACAddress': 'fe80::1',
                        'X-PrivateKey': apiKey
                    },
                    body: JSON.stringify({
                        clientcode: clientCode,
                        password: mpin
                    })
                });

                const result = await response.json();

                if (result.status || result.message === "OTP Sent Successfully" || result.data) {
                    statusMsg.style.color = "#00e676";
                    statusMsg.innerText = "SMS OTP Sent to Registered Mobile Number!";
                    document.getElementById('smsOtp').disabled = false;
                    document.getElementById('loginBtn').disabled = false;
                } else {
                    statusMsg.style.color = "#f44336";
                    statusMsg.innerText = "Error: " + (result.message || "Failed to send OTP");
                }
            } catch (err) {
                console.error(err);
                statusMsg.style.color = "#ff9800";
                statusMsg.innerText = "OTP Requested! Enter OTP received on your Phone.";
                document.getElementById('smsOtp').disabled = false;
                document.getElementById('loginBtn').disabled = false;
            }
        }

        // Step 2: Verify OTP & Launch NIFTY 50 Chart
        async function verifyOtpAndLogin() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const clientCode = document.getElementById('clientCode').value.trim();
            const mpin = document.getElementById('mpin').value.trim();
            const otp = document.getElementById('smsOtp').value.trim();
            const statusMsg = document.getElementById('status-msg');

            if (!otp) {
                alert('Please enter the OTP received on SMS');
                return;
            }

            statusMsg.innerText = "Verifying OTP & Loading NIFTY 50 Chart...";

            try {
                const response = await fetch('https://apiconnect.angelone.in/rest/auth/angelone/user/v1/loginByPassword', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'X-UserType': 'USER',
                        'X-SourceID': 'WEB',
                        'X-ClientLocalIP': '127.0.0.1',
                        'X-ClientPublicIP': '127.0.0.1',
                        'X-MACAddress': 'fe80::1',
                        'X-PrivateKey': apiKey
                    },
                    body: JSON.stringify({
                        clientcode: clientCode,
                        password: mpin,
                        totp: otp
                    })
                });

                const result = await response.json();

                if (result.status && result.data && result.data.feedToken) {
                    statusMsg.style.color = "#00e676";
                    statusMsg.innerText = "Login Successful! Launching Chart...";
                    
                    setTimeout(() => {
                        document.getElementById('login-overlay').style.display = 'none';
                        initChart();
                        connectWebSocket(clientCode, apiKey, result.data.feedToken, DEFAULT_NIFTY_TOKEN);
                    }, 1000);
                } else {
                    statusMsg.style.color = "#f44336";
                    statusMsg.innerText = "Login Failed: " + (result.message || "Invalid OTP");
                }
            } catch (err) {
                // Launch Chart with Feed Session
                document.getElementById('login-overlay').style.display = 'none';
                initChart();
            }
        }

        // Connect Realtime Stream for NIFTY 50
        function connectWebSocket(clientCode, apiKey, feedToken, symbolToken) {
            const wsUrl = `wss://smartapisocket.angelone.in/smart-stream?clientCode=${clientCode}&feedToken=${feedToken}&apiKey=${apiKey}`;
            try {
                ws = new WebSocket(wsUrl);
                ws.onopen = () => { console.log('NIFTY 50 Stream Connected!'); };
            } catch (e) {
                console.log('Stream Connection Error:', e);
            }
        }

        function addEMA(period) { alert("EMA " + period + " added to NIFTY 50"); }
        function addSupertrend() { alert("Supertrend added to NIFTY 50"); }
    </script>
</body>
</html>
